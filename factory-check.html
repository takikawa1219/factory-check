                            <div style={{ fontSize:11, color:"#475569" }}>{item.label}</div>
                          </div>
                          <span style={{ fontSize:10, fontWeight:700, padding:"2px 7px", borderRadius:20, flexShrink:0, marginLeft:6,
                            background:dStyle.bg, color:dStyle.color, border:`1px solid ${dStyle.border}` }}>
                            {dStyle.icon} {dStyle.label}
                          </span>
                        </div>
                        <div style={{ display:"flex", gap:6, flexWrap:"wrap", fontSize:10, color:"#64748b" }}>
                          <span style={{ padding:"1px 7px", borderRadius:20, background:"#e0e7ff", color:"#4338ca", fontWeight:600 }}>{freqLabel(item.frequency)}</span>
                          <span>前回: {item.lastDate||"未実施"}</span>
                          <span style={{ color:dStyle.color, fontWeight:(item.ds==="overdue"||item.ds==="soon")?700:400 }}>
                            次回: {item.nextDate||"—"}
                            {item.ds==="overdue" && ` (${Math.abs(item.diff)}日超過)`}
                            {item.ds==="soon" && ` (残り${item.diff}日)`}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div style={{ background:"white", border:`1px solid ${cs.color}22`, borderTop:"none", borderRadius:"0 0 10px 10px", overflowX:"auto" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse" }}>
                    <thead><tr style={{ background:"#f8fafc" }}>
                      <th style={S.th}>設備名</th><th style={S.th}>点検項目</th>
                      <th style={S.th}>頻度</th><th style={S.th}>前回点検日</th>
                      <th style={S.th}>次回点検日</th><th style={S.th}>状態</th>
                    </tr></thead>
                    <tbody>
                      {catItems.map((item,idx) => {
                        const dStyle=DS[item.ds];
                        return (
                          <tr key={idx} style={{ background:item.ds==="overdue"?"#fff5f5":item.ds==="soon"?"#fffbeb":"white" }}>
                            <td style={S.td}><div style={{ display:"flex", alignItems:"center", gap:6 }}>
                              {item.eqImage?<img src={item.eqImage} style={{ width:24,height:24,borderRadius:3,objectFit:"cover" }} alt=""/>:<span>{catIcon}</span>}
                              <span style={{ fontWeight:600 }}>{item.eqName}</span></div></td>
                            <td style={S.td}>{item.label}</td>
                            <td style={S.td}><span style={{ fontSize:11,padding:"2px 8px",borderRadius:20,background:"#e0e7ff",color:"#4338ca",fontWeight:600 }}>{freqLabel(item.frequency)}</span></td>
                            <td style={S.td}>{item.lastDate||<span style={{ color:"#94a3b8" }}>未実施</span>}</td>
                            <td style={{ ...S.td, color:dStyle.color, fontWeight:(item.ds==="overdue"||item.ds==="soon")?700:400 }}>
                              {item.nextDate||<span style={{ color:"#94a3b8" }}>—</span>}
                              {item.ds==="overdue" && <span style={{ fontSize:11 }}> ({Math.abs(item.diff)}日超過)</span>}
                              {item.ds==="soon" && <span style={{ fontSize:11 }}> (残り{item.diff}日)</span>}
                            </td>
                            <td style={S.td}><span style={{ fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20,background:dStyle.bg,color:dStyle.color,border:`1px solid ${dStyle.border}` }}>{dStyle.icon} {dStyle.label}</span></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 設備マスタ編集
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function EquipmentMaster({ equipment, onChange, showNotif, bp }) {
  const CAT_ORDER = ["設備", "治具", "一般計測器", "管理計測器"];
  const [selectedId, setSelectedId] = useState(equipment[0]?.id||null);
  const [showNewEq, setShowNewEq]   = useState(false);
  const [newForm, setNewForm]       = useState({ name:"", assetNo:"", category:"設備", location:"", managerMain:"", managerSub:"", managementCompany:"", spec:"", note:"" });
  const [showDetail, setShowDetail] = useState(!bp.isMobile);
  // フォルダ開閉（カテゴリ名 → bool）
  const allCats = [...new Set([...CAT_ORDER.filter(c=>equipment.some(e=>e.category===c)), ...equipment.map(e=>e.category).filter(c=>!CAT_ORDER.includes(c))])];
  const [openCats, setOpenCats] = useState(() => Object.fromEntries(allCats.map(c=>[c,true])));
  function toggleCat(cat) { setOpenCats(o => ({...o, [cat]: !o[cat]})); }

  const selected = equipment.find(e => e.id===selectedId);

  function updateEquip(id, patch) { onChange(prev => prev.map(e => e.id===id ? { ...e, ...patch } : e)); }
  function deleteEquip(id, name) {
    if (!window.confirm(`「${name}」を削除しますか？`)) return;
    const remaining = equipment.filter(e => e.id!==id);
    onChange(prev => prev.filter(e => e.id!==id));
    setSelectedId(remaining[0]?.id || null);
    showNotif("設備を削除しました");
  }
  function duplicateEquip(eq) {
    const newEq = { ...eq, id:generateId(), name:eq.name+" (複製)",
      checkItems:(eq.checkItems||[]).map(ci => ({ ...ci, id:generateId(), lastDate:null })) };
    onChange(prev => {
      // 元のアイテムの直後に挿入
      const idx = prev.findIndex(e => e.id===eq.id);
      const next = [...prev];
      next.splice(idx+1, 0, newEq);
      return next;
    });
    setSelectedId(newEq.id);
    if (bp.isMobile) setShowDetail(true);
    showNotif(`「${eq.name}」を複製しました`);
  }
  function addEquip() {
    if (!newForm.name.trim())     { showNotif("設備名を入力してください","error"); return; }
    if (!newForm.location.trim()) { showNotif("場所を入力してください","error"); return; }
    const newEq = { id:generateId(), ...newForm, image:null, checkItems:[] };
    onChange(prev => [...prev, newEq]);
    setSelectedId(newEq.id); setShowNewEq(false); setNewForm({ name:"", assetNo:"", category:"設備", location:"", managerMain:"", managerSub:"", managementCompany:"", spec:"", note:"" });
    if (bp.isMobile) setShowDetail(true);
    showNotif("設備を追加しました");
  }

  const handleSelect = (id) => {
    setSelectedId(id);
    if (bp.isMobile) setShowDetail(true);
  };

  // カテゴリ別にグループ化した設備リスト
  const cats = [...new Set([...CAT_ORDER.filter(c=>equipment.some(e=>e.category===c)), ...equipment.map(e=>e.category).filter(c=>!CAT_ORDER.includes(c))])];

  function MasterList() {
    return (
      <div style={{ display:"flex", flexDirection:"column", gap: bp.isDesktop ? 0 : 8 }}>
        {cats.map(cat => {
          const items = equipment.filter(e => e.category===cat);
          const cs    = catStyle(cat);
          const isOpen = openCats[cat] !== false;
          const catIcon = cat==="治具"?"🔧":cat==="一般計測器"||cat==="管理計測器"?"📏":"⚙";
          return (
            <div key={cat}>
              {/* フォルダヘッダー */}
              <div onClick={() => toggleCat(cat)} style={{
                display:"flex", alignItems:"center", gap:8, cursor:"pointer",
                padding: bp.isDesktop ? "8px 12px" : "8px 12px",
                background: isOpen ? cs.bg : "#f8fafc",
                borderBottom:"1px solid #e2e8f0",
                borderRadius: bp.isDesktop ? 0 : (isOpen ? "8px 8px 0 0" : 8),
                userSelect:"none"
              }}>
                <span style={{ fontSize:13 }}>{isOpen?"📂":"📁"}</span>
                <span style={{ fontSize:12, fontWeight:700, color:cs.color, flex:1 }}>
                  {catIcon} {cat}
                  <span style={{ fontSize:11, fontWeight:400, color:"#94a3b8", marginLeft:6 }}>{items.length}</span>
                </span>
                <span style={{ fontSize:11, color:"#94a3b8" }}>{isOpen?"▲":"▼"}</span>
              </div>
              {/* フォルダ中身 */}
              {isOpen && (
                <div style={{
                  background: bp.isDesktop ? "white" : "#fafbfc",
                  border: bp.isDesktop ? "none" : `1px solid ${cs.color}44`,
                  borderTop:"none",
                  borderRadius: bp.isDesktop ? 0 : "0 0 8px 8px",
                  display: bp.isMobile ? "grid" : "block",
                  gridTemplateColumns: bp.isTablet ? "1fr 1fr" : "1fr",
                  gap: bp.isMobile ? 6 : 0,
                  padding: bp.isMobile ? 8 : 0,
                }}>
                  {items.map(eq => {
                    const isActive=eq.id===selectedId&&!bp.isMobile; const ds=equipDS(eq);
                    return (
                      <div key={eq.id} style={{ display:"flex", alignItems:"center", gap:8,
                        padding:"9px 12px",
                        background: isActive ? "#1e293b" : "white", color: isActive ? "white" : "#334155",
                        cursor:"pointer", borderBottom: bp.isDesktop ? "1px solid #f1f5f9" : "none",
                        borderRadius: bp.isMobile ? 8 : 0,
                        boxShadow: bp.isMobile ? "0 1px 3px rgba(0,0,0,0.06)" : "none" }}
                        onClick={() => handleSelect(eq.id)}>
                        {eq.image ? <img src={eq.image} style={{ width:34,height:34,borderRadius:5,objectFit:"cover",flexShrink:0 }} alt="" />
                          : <div style={{ width:34,height:34,borderRadius:5,background:isActive?"#334155":"#f1f5f9",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0 }}>{catIcon}</div>}
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{eq.name}</div>
                          <div style={{ fontSize:11,opacity:0.7 }}>{eq.assetNo ? `${eq.assetNo} · ` : ""}{eq.location}</div>
                        </div>
                        <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:2 }}>
                          {(ds==="overdue"||ds==="soon") && <span style={{ fontSize:9,color:isActive?"#fca5a5":ds==="overdue"?"#dc2626":"#d97706",fontWeight:700 }}>{ds==="overdue"?"⚠超過":"⏰間近"}</span>}
                          {/* 複製ボタン */}
                          <span title="複製" onClick={e => { e.stopPropagation(); duplicateEquip(eq); }}
                            style={{ fontSize:13, cursor:"pointer", opacity:0.5, padding:"2px 4px",
                              color: isActive?"white":"#475569" }}>⧉</span>
                        </div>
                        {bp.isMobile && <span style={{ color:"#94a3b8", fontSize:16 }}>›</span>}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  }

  // スマホ：詳細表示中は設備リストを隠す
  if (bp.isMobile && showDetail && selected) {
    return (
      <div>
        <button style={{ background:"transparent", border:"none", color:"#3b82f6", cursor:"pointer",
          fontSize:14, padding:"0 0 14px", fontWeight:600 }}
          onClick={() => setShowDetail(false)}>← 設備一覧に戻る</button>
        <EquipDetailEditor equipment={selected} onUpdate={p => updateEquip(selected.id,p)}
          onDelete={() => { deleteEquip(selected.id,selected.name); setShowDetail(false); }}
          showNotif={showNotif} bp={bp} allEquipment={equipment} onCopyItems={(targetId,items) => { onChange(prev => prev.map(e => e.id===targetId ? {...e, checkItems:[...e.checkItems||[], ...items.map(ci=>({...ci,id:generateId(),lastDate:null}))]} : e)); showNotif("点検項目を複写しました"); }} />
      </div>
    );
  }

  return (
    <div style={bp.isDesktop ? { display:"flex", gap:16, alignItems:"flex-start" } : {}}>
      {/* 設備リスト */}
      <div style={bp.isDesktop ? { width:240, flexShrink:0, background:"white", borderRadius:10, boxShadow:"0 1px 4px rgba(0,0,0,0.08)", overflow:"hidden" } : {}}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
          padding: bp.isDesktop ? "12px 14px" : "0 0 10px",
          borderBottom: bp.isDesktop ? "1px solid #e2e8f0" : "none",
          background: bp.isDesktop ? "#f8fafc" : "transparent" }}>
          <span style={{ fontSize:13, fontWeight:700, color:"#334155" }}>設備一覧</span>
          <button style={{ background:"#3b82f6", color:"white", border:"none", borderRadius:6,
            padding:"5px 12px", cursor:"pointer", fontSize:12, fontWeight:700 }}
            onClick={() => setShowNewEq(!showNewEq)}>＋ 追加</button>
        </div>
        {showNewEq && (
          <div style={{ padding:12, borderBottom:"1px solid #e2e8f0", display:"flex", flexDirection:"column", gap:6, background:"#f8fafc", borderRadius: bp.isMobile ? 10 : 0, marginBottom: bp.isMobile ? 10 : 0 }}>
            <input style={S.inputSm} placeholder="設備名 *" value={newForm.name} onChange={e => setNewForm({...newForm,name:e.target.value})} />
            <input style={S.inputSm} placeholder="管理番号" value={newForm.assetNo} onChange={e => setNewForm({...newForm,assetNo:e.target.value})} />
            <select style={S.inputSm} value={newForm.category} onChange={e => setNewForm({...newForm,category:e.target.value})}>
              <option value="設備">設備</option><option value="治具">治具</option><option value="一般計測器">一般計測器</option><option value="管理計測器">管理計測器</option>
            </select>
            <input style={S.inputSm} placeholder="場所 *" value={newForm.location} onChange={e => setNewForm({...newForm,location:e.target.value})} />
            <div style={{ display:"flex", gap:6 }}>
              <button style={{ ...S.saveBtn, flex:1 }} onClick={addEquip}>追加</button>
              <button style={S.cancelBtnSm} onClick={() => setShowNewEq(false)}>戻る</button>
            </div>
          </div>
        )}
        <div style={{ maxHeight: bp.isDesktop ? 560 : "none", overflowY: bp.isDesktop ? "auto" : "visible" }}>
          <MasterList />
        </div>
      </div>
      {/* 詳細（PC/Tablet） */}
      {!bp.isMobile && (
        <div style={{ flex:1, minWidth:0 }}>
          {!selected ? <div style={S.empty}>左から設備を選択してください</div>
            : <EquipDetailEditor key={selected.id} equipment={selected} onUpdate={p => updateEquip(selected.id,p)}
                onDelete={() => { deleteEquip(selected.id, selected.name); }} showNotif={showNotif} bp={bp}
                allEquipment={equipment} onCopyItems={(targetId,items) => { onChange(prev => prev.map(e => e.id===targetId ? {...e, checkItems:[...e.checkItems||[], ...items.map(ci=>({...ci,id:generateId(),lastDate:null}))]} : e)); showNotif("点検項目を複写しました"); }} />}
        </div>
      )}
    </div>
  );
}

function EquipDetailEditor({ equipment, onUpdate, onDelete, showNotif, bp, allEquipment, onCopyItems }) {
  const [info, setInfo]           = useState({ name:equipment.name, assetNo:equipment.assetNo||"", category:equipment.category, location:equipment.location, managerMain:equipment.managerMain||"", managerSub:equipment.managerSub||"", managementCompany:equipment.managementCompany||"", spec:equipment.spec||"", note:equipment.note||"" });
  const [infoEdited, setInfoEdited] = useState(false);
  const [items, setItems]         = useState(equipment.checkItems||[]);
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm]   = useState({});
  const [newLabel, setNewLabel]   = useState("");
  const [newFreq, setNewFreq]     = useState("daily");
  const [showCopyModal, setShowCopyModal] = useState(false);
  const [copyTargetId, setCopyTargetId]   = useState("");
  const [copySelected, setCopySelected]   = useState([]);
  const imgRef = useRef();

  function saveInfo() {
    if (!info.name.trim()) { showNotif("設備名を入力してください","error"); return; }
    onUpdate({ name:info.name, assetNo:info.assetNo, category:info.category, location:info.location, managerMain:info.managerMain, managerSub:info.managerSub, managementCompany:info.managementCompany, spec:info.spec, note:info.note });
    setInfoEdited(false); showNotif("設備情報を更新しました");
  }
  function handleImage(e) {
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader(); r.onload=ev=>{ onUpdate({ image:ev.target.result }); showNotif("画像を設定しました"); };
    r.readAsDataURL(file); e.target.value="";
  }
  function saveItems(ni) { setItems(ni); onUpdate({ checkItems:ni }); }
  function addItem() {
    if (!newLabel.trim()) { showNotif("項目名を入力してください","error"); return; }
    saveItems([...items,{ id:generateId(), label:newLabel, frequency:newFreq, lastDate:null }]);
    setNewLabel(""); showNotif("点検項目を追加しました");
  }
  function saveEdit(id) {
    if (!editForm.label.trim()) { showNotif("項目名を入力してください","error"); return; }
    saveItems(items.map(i => i.id===id ? { ...i, label:editForm.label, frequency:editForm.frequency } : i));
    setEditingId(null); showNotif("点検項目を更新しました");
  }
  function deleteItem(id,label) {
    if (!window.confirm(`「${label}」を削除しますか？`)) return;
    saveItems(items.filter(i => i.id!==id)); showNotif("点検項目を削除しました");
  }
  function duplicateItem(item) {
    const idx=items.findIndex(i => i.id===item.id);
    const copy={ ...item, id:generateId(), label:item.label+"（複製）" };
    saveItems([...items.slice(0,idx+1), copy, ...items.slice(idx+1)]); showNotif("複製しました");
  }

  return (
    <div>
      {/* 基本情報 */}
      <div style={{ background:"white", borderRadius:12, padding: bp.isMobile ? 14 : 20, marginBottom:14, boxShadow:"0 1px 4px rgba(0,0,0,0.07)" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
          <span style={{ fontSize:15, fontWeight:700, color:"#0f172a" }}>基本情報</span>
          <button style={{ background:"#fee2e2", color:"#dc2626", border:"1px solid #fca5a5", borderRadius:8, padding:"6px 12px", cursor:"pointer", fontSize:12, fontWeight:600 }} onClick={onDelete}>🗑 削除</button>
        </div>
        <div style={{ display:"flex", gap:14, flexDirection: bp.isMobile ? "column" : "row" }}>
          {/* 画像 */}
          <div style={{ flexShrink:0 }}>
            <div style={{ fontSize:12, fontWeight:600, color:"#475569", marginBottom:6 }}>設備画像</div>
            {equipment.image
              ? <div>
                  <img src={equipment.image} alt="" style={{ width:bp.isMobile?"100%":140, maxWidth:200, height:100, objectFit:"cover", borderRadius:8, display:"block", border:"1px solid #e2e8f0" }} />
                  <div style={{ display:"flex", gap:6, marginTop:6 }}>
                    <button style={{ flex:1, padding:"6px", background:"#f1f5f9", border:"1px solid #e2e8f0", borderRadius:6, cursor:"pointer", fontSize:11, fontWeight:600 }} onClick={() => imgRef.current.click()}>🖼 変更</button>
                    <button style={{ flex:1, padding:"6px", background:"#fee2e2", color:"#dc2626", border:"1px solid #fca5a5", borderRadius:6, cursor:"pointer", fontSize:11, fontWeight:600 }} onClick={() => { if(window.confirm("画像を削除しますか？")) { onUpdate({image:null}); showNotif("削除しました"); }}}>✕ 削除</button>
                  </div>
                </div>
              : <div style={{ width:bp.isMobile?"100%":140, height:100, border:"2px dashed #cbd5e1", borderRadius:8, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", cursor:"pointer", background:"#f8fafc" }} onClick={() => imgRef.current.click()}>
                  <span style={{ fontSize:26, opacity:0.35 }}>{info.category==="治具"?"🔧":info.category==="一般計測器"||info.category==="管理計測器"?"📏":"⚙"}</span>
                  <span style={{ fontSize:11, color:"#64748b", marginTop:4, fontWeight:600 }}>クリックして画像を設定</span>
                </div>
            }
            <input ref={imgRef} type="file" accept="image/*" style={{ display:"none" }} onChange={handleImage} />
          </div>
          {/* テキスト */}
          <div style={{ flex:1, display:"flex", flexDirection:"column", gap:10 }}>
            <div>
              <label style={{ fontSize:12, fontWeight:600, color:"#475569", display:"block", marginBottom:4 }}>設備名 *</label>
              <input style={S.input} value={info.name} onChange={e => { setInfo({...info,name:e.target.value}); setInfoEdited(true); }} />
            </div>
            <div>
              <label style={{ fontSize:12, fontWeight:600, color:"#475569", display:"block", marginBottom:4 }}>管理番号</label>
              <input style={S.input} placeholder="例：EQ-001" value={info.assetNo} onChange={e => { setInfo({...info,assetNo:e.target.value}); setInfoEdited(true); }} />
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <div style={{ flex:1 }}>
                <label style={{ fontSize:12, fontWeight:600, color:"#475569", display:"block", marginBottom:4 }}>カテゴリ</label>
                <select style={S.input} value={info.category} onChange={e => { setInfo({...info,category:e.target.value}); setInfoEdited(true); }}>
                  <option value="設備">設備</option><option value="治具">治具</option><option value="一般計測器">一般計測器</option><option value="管理計測器">管理計測器</option>
                </select>
              </div>
              <div style={{ flex:1 }}>
                <label style={{ fontSize:12, fontWeight:600, color:"#475569", display:"block", marginBottom:4 }}>場所</label>
                <input style={S.input} value={info.location} onChange={e => { setInfo({...info,location:e.target.value}); setInfoEdited(true); }} />
              </div>
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <div style={{ flex:1 }}>
                <label style={{ fontSize:12, fontWeight:600, color:"#475569", display:"block", marginBottom:4 }}>取扱責任者（正）</label>
                <input style={S.input} placeholder="氏名" value={info.managerMain} onChange={e => { setInfo({...info,managerMain:e.target.value}); setInfoEdited(true); }} />
              </div>
              <div style={{ flex:1 }}>
                <label style={{ fontSize:12, fontWeight:600, color:"#475569", display:"block", marginBottom:4 }}>取扱責任者（副）</label>
                <input style={S.input} placeholder="氏名" value={info.managerSub} onChange={e => { setInfo({...info,managerSub:e.target.value}); setInfoEdited(true); }} />
              </div>
            </div>
            <div>
              <label style={{ fontSize:12, fontWeight:600, color:"#475569", display:"block", marginBottom:4 }}>管理会社</label>
              <input style={S.input} placeholder="例：○○メンテナンス株式会社" value={info.managementCompany} onChange={e => { setInfo({...info,managementCompany:e.target.value}); setInfoEdited(true); }} />
            </div>
            <div>
              <label style={{ fontSize:12, fontWeight:600, color:"#475569", display:"block", marginBottom:4 }}>仕様</label>
              <textarea style={{ ...S.input, minHeight:60, resize:"vertical" }} placeholder="型番・規格・メーカーなど" value={info.spec} onChange={e => { setInfo({...info,spec:e.target.value}); setInfoEdited(true); }} />
            </div>
            <div>
              <label style={{ fontSize:12, fontWeight:600, color:"#475569", display:"block", marginBottom:4 }}>備考</label>
              <textarea style={{ ...S.input, minHeight:60, resize:"vertical" }} placeholder="その他メモ" value={info.note} onChange={e => { setInfo({...info,note:e.target.value}); setInfoEdited(true); }} />
            </div>
            {infoEdited && (
              <div style={{ display:"flex", gap:8 }}>
                <button style={{ ...S.saveBtn, flex:1 }} onClick={saveInfo}>保存する</button>
                <button style={S.cancelBtnSm} onClick={() => { setInfo({ name:equipment.name, assetNo:equipment.assetNo||"", category:equipment.category, location:equipment.location, managerMain:equipment.managerMain||"", managerSub:equipment.managerSub||"", managementCompany:equipment.managementCompany||"", spec:equipment.spec||"", note:equipment.note||"" }); setInfoEdited(false); }}>戻る</button>
              </div>
            )}
          </div>
        </div>
      </div>

      {/* 点検項目 */}
      <div style={{ background:"white", borderRadius:12, padding: bp.isMobile ? 14 : 20, boxShadow:"0 1px 4px rgba(0,0,0,0.07)" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
          <div style={{ fontSize:15, fontWeight:700, color:"#0f172a" }}>
            点検項目 <span style={{ fontSize:13, fontWeight:400, color:"#94a3b8" }}>（{items.length}件）</span>
          </div>
          {items.length > 0 && allEquipment && (
            <button onClick={() => { setCopyTargetId(""); setCopySelected(items.map(i=>i.id)); setShowCopyModal(true); }}
              style={{ background:"#eff6ff", color:"#3b82f6", border:"1px solid #bfdbfe", borderRadius:7, padding:"5px 12px", cursor:"pointer", fontSize:12, fontWeight:700 }}>
              📋 他設備へ複写
            </button>
          )}
        </div>
        {/* 複写モーダル */}
        {showCopyModal && (
          <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:3000, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
            <div style={{ background:"white", borderRadius:14, width:"100%", maxWidth:480, boxShadow:"0 8px 40px rgba(0,0,0,0.2)", maxHeight:"80vh", display:"flex", flexDirection:"column" }}>
              <div style={{ padding:"16px 18px 12px", borderBottom:"1px solid #e2e8f0" }}>
                <div style={{ fontSize:15, fontWeight:700, color:"#0f172a", marginBottom:2 }}>📋 点検項目の複写</div>
                <div style={{ fontSize:12, color:"#64748b" }}>複写する項目と複写先の設備を選択してください</div>
              </div>
              <div style={{ overflowY:"auto", padding:"12px 18px", flex:1 }}>
                {/* 複写先選択 */}
                <div style={{ marginBottom:12 }}>
                  <label style={{ fontSize:12, fontWeight:700, color:"#475569", display:"block", marginBottom:6 }}>複写先の設備</label>
                  <select style={{ ...S.input }} value={copyTargetId} onChange={e => setCopyTargetId(e.target.value)}>
                    <option value="">-- 選択してください --</option>
                    {(allEquipment||[]).filter(e => e.id!==equipment.id).map(e => (
                      <option key={e.id} value={e.id}>{e.name}（{e.category} / {e.location}）</option>
                    ))}
                  </select>
                </div>
                {/* 複写する項目の選択 */}
                <div>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                    <label style={{ fontSize:12, fontWeight:700, color:"#475569" }}>複写する点検項目</label>
                    <button onClick={() => setCopySelected(copySelected.length===items.length ? [] : items.map(i=>i.id))}
                      style={{ fontSize:11, color:"#3b82f6", background:"none", border:"none", cursor:"pointer", fontWeight:600 }}>
                      {copySelected.length===items.length ? "すべて解除" : "すべて選択"}
                    </button>
                  </div>
                  <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
                    {items.map(item => (
                      <label key={item.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 10px", borderRadius:7, background: copySelected.includes(item.id)?"#eff6ff":"#f8fafc", cursor:"pointer", border:`1px solid ${copySelected.includes(item.id)?"#bfdbfe":"#e2e8f0"}` }}>
                        <input type="checkbox" checked={copySelected.includes(item.id)}
                          onChange={() => setCopySelected(prev => prev.includes(item.id) ? prev.filter(x=>x!==item.id) : [...prev,item.id])} />
                        <span style={{ fontSize:13, flex:1, color:"#334155" }}>{item.label}</span>
                        <span style={{ fontSize:10, padding:"1px 7px", borderRadius:20, background:"#e0e7ff", color:"#4338ca", fontWeight:600 }}>{freqLabel(item.frequency)}</span>
                      </label>
                    ))}
                  </div>
                </div>
              </div>
              <div style={{ padding:"12px 18px 16px", borderTop:"1px solid #e2e8f0", display:"flex", gap:8 }}>
                <button
                  disabled={!copyTargetId || copySelected.length===0}
                  onClick={() => {
                    const toCopy = items.filter(i => copySelected.includes(i.id));
                    onCopyItems(copyTargetId, toCopy);
                    setShowCopyModal(false);
                  }}
                  style={{ flex:1, padding:"10px", background: (!copyTargetId||copySelected.length===0)?"#e2e8f0":"#3b82f6", color: (!copyTargetId||copySelected.length===0)?"#94a3b8":"white", border:"none", borderRadius:8, cursor: (!copyTargetId||copySelected.length===0)?"not-allowed":"pointer", fontSize:14, fontWeight:700 }}>
                  複写する（{copySelected.length}件）
                </button>
                <button onClick={() => setShowCopyModal(false)}
                  style={{ padding:"10px 16px", background:"#f1f5f9", color:"#475569", border:"1px solid #e2e8f0", borderRadius:8, cursor:"pointer", fontSize:13, fontWeight:600 }}>
                  キャンセル
                </button>
              </div>
            </div>
          </div>
        )}
        {/* 追加フォーム */}
        <div style={{ display:"flex", gap:8, marginBottom:12, flexDirection: bp.isMobile ? "column" : "row" }}>
          <input style={{ ...S.input, flex:1 }} value={newLabel} onChange={e => setNewLabel(e.target.value)}
            placeholder="新しい点検項目を入力..." onKeyDown={e => e.key==="Enter" && addItem()} />
          <div style={{ display:"flex", gap:8 }}>
            <select style={{ ...S.input, flex: bp.isMobile ? 1 : "none" }} value={newFreq} onChange={e => setNewFreq(e.target.value)}>
              {FREQUENCY_OPTIONS.map(f => <option key={f.value} value={f.value}>{f.label}</option>)}
            </select>
            <button style={{ ...S.addBtn, minHeight:bp.isMobile?44:"auto" }} onClick={addItem}>＋ 追加</button>
          </div>
        </div>
        {/* 項目リスト */}
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {items.map((item,idx) => {
            const nextDate=calcNextDate(item.lastDate,item.frequency); const ds=deadlineStatus(nextDate); const dStyle=DS[ds];
            return (
              <div key={item.id} style={{ background:"#f8fafc", borderRadius:10, padding: bp.isMobile ? "12px 12px" : "10px 14px",
                borderLeft:`3px solid ${dStyle.color}`, display:"flex", alignItems:"flex-start", gap:8 }}>
                <span style={{ fontSize:12, color:"#94a3b8", minWidth:20, textAlign:"right", paddingTop:2, flexShrink:0 }}>{idx+1}</span>
                {editingId===item.id ? (
                  <div style={{ flex:1, display:"flex", flexDirection:"column", gap:8 }}>
                    <input style={{ ...S.inlineInput, width:"100%" }} value={editForm.label}
                      onChange={e => setEditForm({...editForm,label:e.target.value})}
                      onKeyDown={e => e.key==="Enter" && saveEdit(item.id)} autoFocus />
                    <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                      <select style={{ ...S.input, flex:1 }} value={editForm.frequency} onChange={e => setEditForm({...editForm,frequency:e.target.value})}>
                        {FREQUENCY_OPTIONS.map(f => <option key={f.value} value={f.value}>{f.label}</option>)}
                      </select>
                      <button style={{ ...S.saveBtn, minHeight:bp.isMobile?40:"auto" }} onClick={() => saveEdit(item.id)}>保存</button>
                      <button style={S.cancelBtnSm} onClick={() => setEditingId(null)}>戻る</button>
                    </div>
                  </div>
                ) : (
                  <>
                    <div style={{ flex:1 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap", marginBottom:3 }}>
                        <span style={{ fontSize: bp.isMobile ? 14 : 13, color:"#334155", fontWeight:500 }}>{item.label}</span>
                        <span style={{ fontSize:11, fontWeight:600, padding:"2px 8px", borderRadius:20, background:"#e0e7ff", color:"#4338ca" }}>{freqLabel(item.frequency)}</span>
                        {(ds==="overdue"||ds==="soon") && (
                          <span style={{ fontSize:11, fontWeight:700, padding:"2px 7px", borderRadius:20, background:dStyle.bg, color:dStyle.color }}>{dStyle.icon} {dStyle.label}</span>
                        )}
                      </div>
                      <div style={{ fontSize:11, color:"#94a3b8" }}>
                        前回: {item.lastDate||"未実施"}
                        {nextDate && <span style={{ marginLeft:8, color:dStyle.color, fontWeight:(ds==="overdue"||ds==="soon")?700:400 }}>次回: {nextDate}</span>}
                      </div>
                    </div>
                    <div style={{ display:"flex", gap:4, flexShrink:0 }}>
                      <button style={{ ...S.editBtn, minHeight:bp.isMobile?36:"auto", minWidth:bp.isMobile?36:"auto" }}
                        onClick={() => { setEditingId(item.id); setEditForm({ label:item.label, frequency:item.frequency||"none" }); }}>✏</button>
                      <button style={{ ...S.dupBtn, minHeight:bp.isMobile?36:"auto" }} onClick={() => duplicateItem(item)}>⧉</button>
                      <button style={{ ...S.deleteBtn, minHeight:bp.isMobile?36:"auto", minWidth:bp.isMobile?36:"auto" }}
                        onClick={() => deleteItem(item.id,item.label)}>🗑</button>
                    </div>
                  </>
                )}
              </div>
            );
          })}
          {items.length===0 && <div style={S.empty}>点検項目がありません</div>}
        </div>
      </div>
    </div>
  );
}

function AlertsView({ records, bp }) {
  const CAT_ORDER = ["設備", "治具", "一般計測器", "管理計測器"];
  const bad = records.filter(r => r.overall!=="正常");
  const cats = [...new Set([...CAT_ORDER.filter(c=>bad.some(r=>r.equipment.category===c)), ...bad.map(r=>r.equipment.category).filter(c=>!CAT_ORDER.includes(c))])];
  const [openCats, setOpenCats] = useState(() => Object.fromEntries(CAT_ORDER.map(c=>[c,true])));
  function toggleCat(cat) { setOpenCats(o => ({...o,[cat]:!o[cat]})); }

  return (
    <>
      <h3 style={S.sectionTitle}>異常・要注意 アラート</h3>
      {bad.length===0 && <div style={S.empty}>現在、異常・要注意の記録はありません ✓</div>}
      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {cats.map(cat => {
          const catRecs = bad.filter(r => r.equipment.category===cat);
          const cs = catStyle(cat);
          const isOpen = openCats[cat] !== false;
          const catIcon = cat==="治具"?"🔧":cat==="一般計測器"||cat==="管理計測器"?"📏":"⚙";
          const abnCount = catRecs.filter(r=>r.overall==="異常").length;
          const warnCount = catRecs.filter(r=>r.overall==="要注意").length;
          return (
            <div key={cat} style={{ borderRadius:10, overflow:"hidden", boxShadow:"0 1px 4px rgba(0,0,0,0.07)" }}>
              <button onClick={() => toggleCat(cat)} style={{
                width:"100%", display:"flex", alignItems:"center", gap:10,
                background: isOpen ? cs.bg : "#f8fafc",
                border:`1px solid ${isOpen ? cs.color+"44" : "#e2e8f0"}`,
                borderRadius: isOpen ? "10px 10px 0 0" : 10,
                padding:"10px 14px", cursor:"pointer", textAlign:"left"
              }}>
                <span style={{ fontSize:15 }}>{isOpen?"📂":"📁"}</span>
                <span style={{ fontSize:13, fontWeight:700, color:cs.color, flex:1 }}>
                  {catIcon} {cat}
                  <span style={{ fontSize:11, fontWeight:400, color:"#94a3b8", marginLeft:6 }}>{catRecs.length}件</span>
                  {abnCount>0 && <span style={{ fontSize:11, fontWeight:700, color:"#dc2626", marginLeft:8 }}>✕ 異常{abnCount}件</span>}
                  {warnCount>0 && <span style={{ fontSize:11, fontWeight:700, color:"#d97706", marginLeft:6 }}>⚠ 要注意{warnCount}件</span>}
                </span>
                <span style={{ fontSize:11, color:"#94a3b8" }}>{isOpen?"▲":"▼"}</span>
              </button>
              {isOpen && (
                <div style={{ background:"white", border:`1px solid ${cs.color}22`, borderTop:"none", borderRadius:"0 0 10px 10px", padding:"8px 10px", display:"flex", flexDirection:"column", gap:8 }}>
                  {catRecs.map(rec => {
                    const cfg=STATUS_CONFIG[rec.overall]; const badItems=rec.items.filter(i => i.status!=="正常"&&i.status!=="未点検");
                    return (
                      <div key={rec.id} style={{ borderRadius:8, padding:12, borderLeft:`4px solid ${cfg.color}`, background:cfg.bg }}>
                        <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:6, flexWrap:"wrap" }}>
                          <strong>{rec.equipment.name}</strong>
                          <span style={{ color:cfg.color, fontWeight:700 }}>{cfg.icon} {rec.overall}</span>
                          <span style={{ color:"#64748b", fontSize:12 }}>{rec.date} · {rec.inspector}</span>
                        </div>
                        {badItems.map(it => (
                          <div key={it.id} style={{ fontSize:13, color:"#334155", paddingLeft:8, marginTop:4 }}>
                            • {it.label} → <span style={{ color:STATUS_CONFIG[it.status].color, fontWeight:600 }}>{it.status}</span>
                            {it.note && <span style={{ color:"#475569" }}>: {it.note}</span>}
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </>
  );
}

const S = {

  addBtn: { background:"#3b82f6", color:"white", border:"none", borderRadius:8, padding:"8px 16px", cursor:"pointer", fontSize:13, fontWeight:700, whiteSpace:"nowrap" },

  dupBtn: { background:"#eff6ff", color:"#3b82f6", border:"1px solid #bfdbfe", borderRadius:7, padding:"5px 10px", cursor:"pointer", fontSize:12, fontWeight:700 },
  deleteBtn: { background:"#fee2e2", color:"#dc2626", border:"1px solid #fca5a5", borderRadius:7, padding:"5px 10px", cursor:"pointer", fontSize:12 },
  cancelBtnSm: { background:"transparent", color:"#64748b", border:"1px solid #cbd5e1", borderRadius:8, padding:"7px 12px", cursor:"pointer", fontSize:13 },
};
